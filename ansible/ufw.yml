---
- name: Configure UFW firewall - SSH only
  hosts: linux_hosts
  become: yes
  tasks:
    - name: Set default policy to deny incoming
      ansible.builtin.ufw:
        direction: incoming
        policy: deny
    - name: Allow SSH
      ansible.builtin.ufw:
        rule: allow
        port: '22'
        proto: tcp
    - name: Enable UFW
      ansible.builtin.ufw:
        state: enabled
