---
- name: Install and configure fail2ban for SSH
  hosts: linux_hosts
  become: yes
  tasks:
    - name: Install fail2ban
      ansible.builtin.apt:
        name: fail2ban
        state: present
        update_cache: yes

    - name: Configure sshd jail
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.local
        owner: root
        group: root
        mode: '0644'
        content: |
          [DEFAULT]
          ignoreip = 127.0.0.1/8 ::1 192.168.1.0/24
          bantime.increment = true
          bantime.factor = 2
          bantime.maxtime = 1w

          [sshd]
          enabled = true
          port = 22
          backend = systemd
          maxretry = 5
          findtime = 10m
          bantime = 1h
      notify: restart fail2ban

    - name: Enable and start fail2ban
      ansible.builtin.systemd:
        name: fail2ban
        enabled: yes
        state: started

  handlers:
    - name: restart fail2ban
      ansible.builtin.systemd:
        name: fail2ban
        state: restarted
